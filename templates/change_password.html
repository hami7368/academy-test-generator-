{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:420px;margin:1rem auto"><h1>Change Password</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password</label><input type="password" name="current" required>
<label>New password (8+ characters)</label><input type="password" name="new" required>
<label>Repeat new password</label><input type="password" name="new2" required>
<button type="submit">Change password</button></form></div>{% endblock %}
