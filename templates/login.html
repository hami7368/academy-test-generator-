{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
<h1>Login</h1>
<p class="muted">Private app — only accounts added by the admin can log in. There is no public registration.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Log in</button>
</form>
<p class="muted">First time? The owner creates the admin account at <a href="/setup">/setup</a> (one time only).</p>
</div>{% endblock %}
